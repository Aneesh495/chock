[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "chock"
version = "0.1.0"
description = "High-performance programmable data plane and in-network telemetry engine in P4_16"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [
    {name = "Aneesh", email = "aneeshkrishnaparthasarathy@gmail.com"}
]
keywords = [
    "p4-16",
    "in-network-telemetry",
    "programmable-dataplane",
    "software-defined-networking",
    "srv6",
    "flowlet-switching",
    "packet-processing"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: System :: Networking",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14"
]

dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "scapy>=2.5.0"
]

[project.scripts]
chock = "chock.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["chock*"]
